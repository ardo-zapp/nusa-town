services:
  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - login
      - game-main
      - game-safe
      - admin
    restart: unless-stopped

  login:
    build: .
    command: ["node", "--max_old_space_size=4096", "pony-town.js", "--login"]
    expose:
      - "8090"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  game-main:
    build: .
    command: ["node", "--max_old_space_size=4096", "pony-town.js", "--game", "main"]
    expose:
      - "8090"
      - "10092"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  game-safe:
    build: .
    command: ["node", "--max_old_space_size=4096", "pony-town.js", "--game", "safe"]
    expose:
      - "8091"
      - "10093"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: .
    command: ["node", "--max_old_space_size=4096", "pony-town.js", "--admin", "--standaloneadmin"]
    expose:
      - "8091"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    healthcheck:
      test: mongosh --eval 'db.runCommand("ping").ok'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
